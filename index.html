<!doctype html>
<html>
	<head>
		<title>Inventory Management</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link href="style.css" rel="stylesheet" />
	</head>
	<body>
		<div class="container mt-4">
			<h2 class="text-center mb-4">Inventory Management System</h2>

			<div class="card p-3 mb-3">
				<h5>Add Product</h5>
				<input id="name" class="form-control mb-2" placeholder="Product Name" />
				<input id="price" type="number" class="form-control mb-2" placeholder="Price" />
				<input id="qty" type="number" class="form-control mb-2" placeholder="Quantity" />
				<button class="btn btn-primary" onclick="addProduct()">Add Product</button>
			</div>

			<table class="table table-bordered">
				<thead class="table-dark">
					<tr>
						<th>Name</th>
						<th>Price</th>
						<th>Quantity</th>
					</tr>
				</thead>
				<tbody id="list"></tbody>
			</table>
		</div>

		<script src="script.js"></script>
	</body>
</html>
